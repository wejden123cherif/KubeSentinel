
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
spec:
  ingressClassName: traefik
  rules:
    - host: ecommerce.test
      http:
        paths:
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 5000

          - path: /users
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 5000

          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 5000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5500

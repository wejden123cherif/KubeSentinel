
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ecommerce-order:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5003
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: ORDER_DATABASE_URL

            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: API_TOKEN

            - name: USER_SERVICE_URL
              value: "http://user-service:5002"

            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:5001"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 5003
      targetPort: 5003

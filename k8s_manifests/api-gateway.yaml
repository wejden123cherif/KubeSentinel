
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ecommerce-gateway:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          env:
            - name: USER_SERVICE_URL
              value: "http://user-service:5002"

            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:5001"

            - name: ORDER_SERVICE_URL
              value: "http://order-service:5003"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
